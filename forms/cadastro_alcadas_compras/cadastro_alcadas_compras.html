<html>

<head>
	<link type="text/css" rel="stylesheet" href="/style-guide/css/fluig-style-guide.min.css" />
	<link rel="stylesheet" href="styles.css">
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery.js"></script>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery-ui.min.js"></script>
	<script type="text/javascript" src="/portal/resources/js/mustache/mustache-min.js"></script>
	<script type="text/javascript" src="/style-guide/js/fluig-style-guide.min.js" charset="utf-8"></script>
	<script type="text/javascript" src="/webdesk/vcXMLRPC.js"></script>
	<script type="text/javascript" src="gd-lib.js"></script>
	<script type="text/javascript" src="gd_lib.js"></script>
	<script type="text/javascript" src="index.js"></script>
	<script type="text/javascript" src="jurisdictionModal.js"></script>
</head>

<body>
	<div class="fluig-style-guide">
		<form name="form" role="form">
			<h2>Cadastro de alçadas Compras/Financeiro</h2>

			<button type="button" id="addJurisdiction" class="btn btn-success"
				onclick="openModalJurisdiction()">Adicionar</button>

			<div class="table-responsive">
				<table tablename="tb_jurisdictions" id="tb_jurisdictions" class="table table-bordered" noaddbutton="true"
					nodeletebutton="true">
					<thead>
						<tr>
							<th></th>
							<th>Valores</th>
							<th>C.S.C</th>
							<th>Setores</th>
							<th>Tipo de Atribuição</th>
							<th>Campo do Formulário</th>
							<th>1 º Aprovador</th>
							<th>2º Aprovador</th>
							<th>3º Aprovador</th>
							<th>4º Aprovador</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td><i class="flaticon flaticon-trash icon-md" aria-hidden="true" onclick="removeJurisdiction(this)"></i>
							</td>
							<td>
								<div id="valuesContainer">
									<input type="text" id="startValue" name="startValue" readonly />
									<input type="text" id="endValue" name="endValue" readonly />
								</div>
							</td>
							<td><input type="text" id="csc" name="csc" readonly /></td>
							<td><input type="text" id="sectors" name="sectors" readonly /></td>
							<td><input type="text" id="assignmentType" name="assignmentType" readonly /></td>
							<td><input type="text" id="formFieldForApproval" name="formFieldForApproval" readonly /></td>
							<td><input type="text" id="approver_1" name="approver_1" readonly /></td>
							<td><input type="text" id="approver_2" name="approver_2" readonly /></td>
							<td><input type="text" id="approver_3" name="approver_3" readonly /></td>
							<td><input type="text" id="approver_4" name="approver_4" readonly /></td>
						</tr>
					</tbody>
				</table>
			</div>
		</form>
	</div>
</body>

</html>
